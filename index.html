<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f9" />
    <link rel="icon" href="/icon-192.png" />
    <link href="./output.css" rel="stylesheet">
    <script>
      (function () {
        var pref = 'auto', h = new Date().getHours()
        try { pref = JSON.parse(localStorage.getItem('pg_settings')).theme || 'auto' } catch (e) {}
        document.documentElement.dataset.theme = pref === 'auto' ? (h >= 6 && h < 19 ? 'light' : 'dark') : pref
      })()
    </script>
    <title>PoultryGuardian-CI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
